name: CI Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  ci-build:
    name: Build on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      matrix:
        platform: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: backend/go.sum

      - name: Set up Rust (macOS)
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set up Rust (Windows)
        if: matrix.platform == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            desktop-app/src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run macOS build script
        if: matrix.platform == 'macos-latest'
        run: ./scripts/build-mac.sh
      
      - name: Inspect macOS build outputs
        if: matrix.platform == 'macos-latest'
        run: |
          echo "Apps:"
          find desktop-app/src-tauri/target -name "*.app"

          echo ""
          echo "DMGs:"
          find desktop-app/src-tauri/target -name "*.dmg"
    
      - name: Prepare macOS Artifacts & Build Info
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p artifacts
          
          # Write build-info.json
          VERSION=$(git describe --tags --always 2>/dev/null || echo "0.1.0")
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          echo "{\"version\":\"$VERSION\",\"commit\":\"$COMMIT\",\"buildTime\":\"$BUILD_TIME\"}" > artifacts/build-info.json
          
          # Locate and copy DMG & APP
          APP_PATH="desktop-app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Justsent.app"
          DMG_PATH=$(find desktop-app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)

          if [ -z "$DMG_PATH" ]; then
            echo "Error: DMG file not found!" >&2
            exit 1
          fi
          cp "$DMG_PATH" artifacts/JustSent.dmg

          if [ ! -d "$APP_PATH" ]; then
            echo "Error: APP directory not found at $APP_PATH" >&2
            exit 1
          fi
          cp -R "$APP_PATH" artifacts/JustSent.app
          # Also compress with ditto to preserve macOS code signatures and resource forks for direct zip downloads
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/JustSent.app.zip

      - name: Upload macOS Build Artifacts
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: justsent-mac-build
          path: artifacts/
          retention-days: 14

      - name: Run Windows build script
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          ./scripts/build-backend-windows.ps1
          cd desktop-app
          bun install
          bunx tauri build

      - name: Prepare Windows Artifacts
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts-win | Out-Null
          
          $Version = "0.1.0"
          try { $Version = (git describe --tags --always) } catch {}
          $Commit = "unknown"
          try { $Commit = (git rev-parse --short HEAD) } catch {}
          $BuildTime = (Get-Date -UFormat "%Y-%m-%dT%H:%M:%SZ")
          
          @{
              version = $Version
              commit = $Commit
              buildTime = $BuildTime
          } | ConvertTo-Json | Set-Content -Path artifacts-win\build-info.json -Force

          # Copy installers
          $MsiPath = Get-ChildItem -Path desktop-app\src-tauri\target\release\bundle\msi\*.msi | Select-Object -First 1
          if ($MsiPath) {
              Copy-Item $MsiPath.FullName -Destination artifacts-win\JustSent.msi -Force
          }
          $NsisPath = Get-ChildItem -Path desktop-app\src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          if ($NsisPath) {
              Copy-Item $NsisPath.FullName -Destination artifacts-win\JustSent-Setup.exe -Force
          }

      - name: Upload Windows Build Artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: justsent-windows-build
          path: artifacts-win/
          retention-days: 14
